    <g fill="#f7d51d"><rect x="214" y="226" width="14" height="14"/><rect x="228" y="226" width="14" height="14"/><rect x="214" y="198" width="0" height="0"/><rect x="228" y="212" width="14" height="14"/><rect x="242" y="212" width="14" height="14"/></g>
