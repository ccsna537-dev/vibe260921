<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="종스크롤 슈팅 게임">
  <rect width="400" height="240" fill="#0c1a12"/>
  <!-- ground tiles -->
  <g>
    <rect x="0" y="0" width="120" height="240" fill="#14301f"/>
    <rect x="280" y="0" width="120" height="240" fill="#173822"/>
    <rect x="120" y="0" width="160" height="240" fill="#2b3f52"/>
    <path d="M200 0v240" stroke="#8fa6b8" stroke-width="3" stroke-dasharray="14 12" opacity=".5"/>
    <rect x="20" y="150" width="50" height="34" fill="#20472d"/><rect x="315" y="40" width="46" height="46" fill="#1f4a2c"/>
    <rect x="330" y="170" width="40" height="30" fill="#255435"/>
  </g>
  <!-- ground enemies -->
  <g fill="#9e9e9e" stroke="#555">
    <circle cx="70" cy="70" r="12"/><rect x="60" y="62" width="20" height="4" fill="#666"/>
    <rect x="308" y="118" width="26" height="16" rx="3"/>
  </g>
  <!-- bomb crosshair -->
  <g stroke="#ffeb3b" stroke-width="2" fill="none"><circle cx="200" cy="90" r="10"/><path d="M200 74v32M184 90h32"/></g>
  <!-- air enemies -->
  <g fill="#ce93d8" stroke="#8e24aa" stroke-width="2">
    <circle cx="150" cy="30" r="10" fill="none"/><circle cx="185" cy="46" r="10" fill="none"/>
    <circle cx="220" cy="30" r="10" fill="none"/><circle cx="255" cy="46" r="10" fill="none"/>
  </g>
  <!-- bullets -->
  <g fill="#fff59d"><rect x="196" y="120" width="3" height="12"/><rect x="202" y="140" width="3" height="12"/></g>
  <!-- player ship -->
  <g>
    <polygon points="200,160 216,204 200,196 184,204" fill="#e6edf3" stroke="#58a6ff" stroke-width="2"/>
    <polygon points="200,170 206,190 194,190" fill="#58a6ff"/>
  </g>
  <!-- enemy shot -->
  <circle cx="230" cy="70" r="4" fill="#ff7043"/>
</svg>
